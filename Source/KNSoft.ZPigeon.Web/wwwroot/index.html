<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KNSoft ZPigeon</title>
  <link rel="stylesheet" href="vendor/xterm/xterm.css">
  <style>
    :root{color-scheme:dark;--bg:#0c1017;--panel:#141a24;--line:#283142;--text:#d9e1ee;--muted:#8491a5;--accent:#70a5ff;--danger:#ff7382}
    *{box-sizing:border-box}[hidden]{display:none!important}html,body{height:100%;margin:0}body{font:14px system-ui,"Microsoft YaHei UI",sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
    button,input,select{font:inherit;color:inherit;background:#1c2431;border:1px solid #344056;border-radius:6px;padding:7px 10px}button{cursor:pointer}button:hover{border-color:#60718e}button:disabled{cursor:not-allowed;opacity:.45}
    header{height:54px;display:flex;align-items:center;gap:18px;padding:0 18px;border-bottom:1px solid var(--line);background:#111722}header strong{font-size:16px}header .status{margin-left:auto;color:var(--muted)}.app-nav{display:flex;gap:4px}.app-nav button{border-color:transparent;background:transparent}.app-nav button.active{color:var(--accent);background:#1c2635;border-color:#344056}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 6px 0 14px;background:#596579}.dot.ok{background:#43d17d}.dot.off{background:#e2616e}
    main{display:grid;grid-template-rows:auto 1fr;height:calc(100% - 54px)}.toolbar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}.toolbar .spacer{flex:1}.danger{color:#ff9aa5}
    .shell-select{min-width:190px}.add-shell{font-size:18px;line-height:1;padding:6px 10px}
    .workspace{min-height:0;display:grid;grid-template-rows:39px 1fr}.tabs{display:flex;align-items:end;gap:2px;padding:5px 10px 0;background:#0f141d;border-bottom:1px solid var(--line);overflow-x:auto}.tab{max-width:220px;min-width:120px;border-radius:6px 6px 0 0;border-bottom:0;padding:8px 12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tab.active{background:#171e2a;color:var(--text);border-color:var(--line)}
    .terminals{position:relative;min-height:0;background:#0b0f15}.terminal-panel{position:absolute;inset:0;padding:10px;display:none}.terminal-panel.active{display:block}.terminal-host{width:100%;height:100%}.empty{height:100%;display:grid;place-content:center;text-align:center;color:var(--muted);gap:12px}.empty b{color:var(--text);font-size:18px}.empty button{justify-self:center}
    dialog{width:min(780px,calc(100% - 30px));max-height:80vh;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}dialog::backdrop{background:#0009}dialog label{display:block;color:var(--muted);margin:12px 0 5px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.dialog-input{width:100%}.clipboard-preview{max-height:280px;white-space:pre-wrap;word-break:break-word}.context-menu{position:fixed;z-index:10;display:grid;min-width:150px;padding:5px;background:#1a2230;border:1px solid #3a465c;border-radius:7px;box-shadow:0 10px 30px #0008}.context-menu button{text-align:left;background:transparent;border:0;border-radius:4px}.context-menu button:hover{background:#2a3547}.toast{position:fixed;right:16px;bottom:16px;z-index:20;max-width:min(480px,calc(100% - 32px));padding:10px 13px;background:#30202a;border:1px solid #713b4e;border-radius:7px}.tools{display:grid;gap:16px}.card{border:1px solid var(--line);border-radius:8px;padding:14px}.card h2{font-size:15px;margin:0 0 10px}.card label{display:block;color:var(--muted);margin:8px 0 4px}.card input{width:min(100%,420px)}pre{white-space:pre-wrap;word-break:break-word;background:#090d13;padding:12px;border-radius:7px;max-height:260px;overflow:auto}.xterm{height:100%;padding:2px}.xterm-viewport{border-radius:5px}
    #registryView{display:block;height:calc(100% - 54px)}.registry-editor{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}.registry-toolbar{display:flex;gap:8px;align-items:center;padding:9px 12px;background:var(--panel);border-bottom:1px solid var(--line)}.registry-address{display:flex;align-items:center;flex:1;min-width:80px;min-height:34px;padding:7px 11px;background:#0c1119;border:1px solid #344056;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.registry-body{display:grid;grid-template-columns:minmax(260px,32%) 1fr;min-height:0}.registry-tree,.registry-list{min-width:0;overflow:auto;background:#0d121a}.registry-tree{border-right:1px solid var(--line);padding:8px 4px}.registry-tree ul{list-style:none;margin:0;padding-left:18px}.registry-tree>ul{padding-left:0}.registry-node-row{display:flex;align-items:center;border-radius:4px}.registry-node-row:hover,.registry-node-row.selected,.registry-list tr.selected{background:#24334a}.registry-arrow,.registry-node-label{border:0;background:transparent;padding:4px}.registry-arrow{width:24px}.registry-arrow:disabled{opacity:1}.registry-node-label{flex:1;text-align:left;white-space:nowrap}.registry-list{position:relative}.registry-list table{width:100%;border-collapse:collapse;table-layout:fixed}.registry-list th{position:sticky;top:0;z-index:1;background:#17202c;text-align:left;color:var(--muted);font-weight:500}.registry-list th,.registry-list td{height:30px;padding:5px 10px;border-bottom:1px solid #202937;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.registry-list th:nth-child(1){width:30%}.registry-list th:nth-child(2){width:24%}.registry-list tr:hover{background:#192331}.registry-empty{position:absolute;inset:31px 0 0;display:grid;place-content:center;color:var(--muted);pointer-events:none}.registry-more,.registry-more-node{margin:8px}.registry-value-data{width:100%;min-height:180px;resize:vertical;color:var(--text);background:#0c1119;border:1px solid #344056;border-radius:6px;padding:9px;font:14px "Cascadia Mono",Consolas,monospace}
    .manager-view{display:block;height:calc(100% - 54px)}.manager{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}.manager-toolbar{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--panel);border-bottom:1px solid var(--line)}.manager-toolbar input{min-width:240px;flex:0 1 560px}.manager-table{position:relative;overflow:auto;background:#0d121a}.manager-table table{width:100%;border-collapse:collapse;table-layout:fixed}.manager-table th{position:sticky;top:0;z-index:1;text-align:left;color:var(--muted);font-weight:500;background:#17202c}.manager-table th,.manager-table td{height:32px;padding:5px 10px;border-bottom:1px solid #202937;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.manager-table tr:hover{background:#192331}.manager-table tr.selected{background:#24334a}.manager-empty{position:absolute;inset:33px 0 0;display:grid;place-content:center;color:var(--muted);pointer-events:none}.manager-table>[data-action=more]{margin:9px}
    .details-grid{display:grid;grid-template-columns:max-content 1fr;gap:8px 16px}.details-grid dt{color:var(--muted)}.details-grid dd{margin:0;min-width:0;overflow-wrap:anywhere;font-family:"Cascadia Mono",Consolas,monospace}
    @media(max-width:760px){.status{display:none}.registry-body{grid-template-columns:minmax(180px,42%) 1fr}}
  </style>
</head>
<body>
  <header>
    <strong>KNSoft ZPigeon</strong>
    <nav class="app-nav"><button class="active" data-view="terminal">远程终端</button><button data-view="files">文件</button><button data-view="processes">进程</button><button data-view="services">服务</button><button data-view="registry">注册表</button></nav>
    <div class="status"><span id="serverDot" class="dot"></span>Server <span id="server">读取中</span><span id="clientDot" class="dot"></span>Client <span id="client">读取中</span></div>
  </header>
  <main id="terminalView">
    <div class="toolbar">
      <select id="shellSelect" class="shell-select" disabled><option>Client 未连接</option></select>
      <button id="newShell" class="add-shell" disabled title="新建 Shell">＋</button>
      <span class="spacer"></span>
      <button id="toolsButton">其他控制</button>
      <button id="closeShell" class="danger" disabled>关闭当前 Shell</button>
    </div>
    <section class="workspace">
      <nav id="tabs" class="tabs"></nav>
      <div id="terminals" class="terminals">
        <div id="empty" class="empty"><b>尚未打开 Shell</b><span>连接 Client 后选择 Shell 并新建会话</span><button id="emptyNew" disabled>新建 Shell</button></div>
      </div>
    </section>
  </main>

  <main id="registryView" hidden><section id="registryEditor" class="registry-editor"></section></main>
  <main id="filesView" class="manager-view" hidden><section id="fileManager" class="manager"></section></main>
  <main id="processesView" class="manager-view" hidden><section id="processManager" class="manager"></section></main>
  <main id="servicesView" class="manager-view" hidden><section id="serviceManager" class="manager"></section></main>

  <dialog id="toolsDialog">
    <div class="toolbar"><strong>其他控制</strong><span class="spacer"></span><button id="closeTools">关闭</button></div>
    <div class="tools">
      <div class="card"><h2>系统信息</h2><button id="systemInfo">读取</button></div>
      <div class="card">
        <h2>事件日志频道</h2><label for="channel">频道路径</label><input id="channel" value="System">
        <label for="query">XPath 查询（可空）</label><input id="query"><label for="maxEvents">每页条数</label><input id="maxEvents" type="number" min="1" max="256" value="10"><br>
        <button id="queryEvents">查询</button><button id="nextEvents">下一页</button><button id="enableChannel">开启</button><button id="disableChannel">关闭</button><button id="clearChannel">清除</button>
      </div>
      <pre id="result">等待操作</pre>
    </div>
  </dialog>

  <div id="tabMenu" class="context-menu" role="menu" hidden>
    <button id="renameTab" role="menuitem">重命名</button>
    <button id="exportTab" role="menuitem">导出文本</button>
    <button id="closeTab" class="danger" role="menuitem">关闭</button>
  </div>

  <dialog id="renameDialog">
    <form method="dialog">
      <h2>重命名标签页</h2>
      <input id="renameInput" class="dialog-input" maxlength="128" required autocomplete="off">
      <div class="dialog-actions"><button value="cancel" formnovalidate>取消</button><button value="rename">重命名</button></div>
    </form>
  </dialog>

  <dialog id="pasteDialog">
    <form method="dialog">
      <h2>确认粘贴</h2>
      <p>粘贴多行或大量文本可能导致命令意外执行。</p>
      <p id="pasteSummary" class="status"></p>
      <pre id="pastePreview" class="clipboard-preview"></pre>
      <div class="dialog-actions"><button value="cancel">取消</button><button value="paste" class="danger">仍然粘贴</button></div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script type="module">
    import {Terminal} from './vendor/xterm/xterm.mjs';
    import {FitAddon} from './vendor/xterm/addon-fit.mjs';
    import {bindTerminalInteractions,exportTerminal,pasteTerminal} from './terminal-interactions.mjs';
    import {RegistryEditor} from './registry-editor.mjs';
    import {FileManager,ProcessManager,ServiceManager} from './management.mjs';

    const $=id=>document.getElementById(id),encoder=new TextEncoder(),sessions=new Map(),shellCounters=new Map();
    const shellSelect=$('shellSelect'),newShell=$('newShell'),emptyNew=$('emptyNew'),tabs=$('tabs'),terminals=$('terminals'),empty=$('empty'),closeShell=$('closeShell'),tabMenu=$('tabMenu'),renameDialog=$('renameDialog'),pasteDialog=$('pasteDialog');
    let active=null,serial=0,eventBookmark='',selectedShell=null,clientConnected=false,shellsLoaded=false,shellsLoading=false,currentView='terminal',fitFrame=0,contextSession=null,renameSession=null,pendingPaste=null,toastTimer=0;
    const registry=new RegistryEditor($('registryEditor'),{call,notify});
    const files=new FileManager($('fileManager'),{call,notify}),processes=new ProcessManager($('processManager'),{call,notify,isConnected:()=>clientConnected}),services=new ServiceManager($('serviceManager'),{call,notify});
    files.disconnect();processes.disconnect();services.disconnect();

    async function refresh(){
      try{
        const state=await fetch('/api/status').then(r=>r.json()),connected=state.clientConnected,disconnected=clientConnected&&!connected;clientConnected=connected;
        $('server').textContent=state.state===2?'运行中':`状态 ${state.state}`;$('client').textContent=connected?'已连接':'未连接';
        $('serverDot').className=`dot ${state.state===2?'ok':'off'}`;$('clientDot').className=`dot ${connected?'ok':'off'}`;
        if(disconnected){selectedShell=null;shellsLoaded=false;shellSelect.replaceChildren(new Option('Client 未连接'));files.disconnect();processes.disconnect();services.disconnect()}
        shellSelect.disabled=newShell.disabled=emptyNew.disabled=!connected||selectedShell===null;
        return connected;
      }catch{$('server').textContent='不可用';return false}
    }

    async function loadShells(){
      if(!clientConnected||currentView!=='terminal'||shellsLoaded||shellsLoading)return;shellsLoading=true;shellSelect.replaceChildren(new Option('正在读取远端 Shell…'));
      try{
        const values=await fetch('/api/terminal/shells').then(async r=>{if(!r.ok)throw new Error(await r.text());return r.json()});
        const previous=selectedShell?.id;selectedShell=values.find(value=>value.id===previous)||values[0]||null;
        shellSelect.replaceChildren(...values.map(value=>new Option(value.name,value.id)));
        selectShell(selectedShell);shellsLoaded=true;
      }catch{selectedShell=null;shellSelect.replaceChildren(new Option(clientConnected?'读取 Shell 失败':'Client 未连接'));shellSelect.disabled=true}
      finally{shellsLoading=false}
    }

    function selectShell(value){
      selectedShell=value;shellSelect.value=value?.id??'';newShell.title=value?`新建 ${value.name}`:'新建 Shell';
    }

    function notify(value){
      const toast=$('toast');toast.textContent=value instanceof Error?value.message:String(value);toast.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.hidden=true,4000);
    }

    function activate(id){
      active=id;for(const [key,session] of sessions){const selected=key===id;session.tab.classList.toggle('active',selected);session.panel.classList.toggle('active',selected)}
      empty.hidden=sessions.size!==0;closeShell.disabled=id===null;scheduleFit();
    }

    function scheduleFit(){
      if(fitFrame||active===null)return;fitFrame=requestAnimationFrame(()=>{fitFrame=0;const session=sessions.get(active);if(!session||!session.panel.classList.contains('active'))return;session.fit.fit();session.terminal.focus();resize(session)})
    }

    function resize(session){
      if(session.id!==active||!session.panel.classList.contains('active')||session.socket.readyState!==WebSocket.OPEN)return;
      const {cols,rows}=session.terminal;if(cols===session.cols&&rows===session.rows)return;session.cols=cols;session.rows=rows;
      session.socket.send(JSON.stringify({Type:'resize',Columns:cols,Rows:rows}));
    }

    function createShell(){
      if(!selectedShell)return;const shell=selectedShell;
      const id=++serial,panel=document.createElement('div'),host=document.createElement('div'),tab=document.createElement('button');
      const shellNumber=(shellCounters.get(shell.id)||0)+1;shellCounters.set(shell.id,shellNumber);
      panel.className='terminal-panel';host.className='terminal-host';panel.append(host);terminals.append(panel);tab.className='tab';tabs.append(tab);active=id;
      for(const session of sessions.values()){session.tab.classList.remove('active');session.panel.classList.remove('active')}panel.classList.add('active');tab.classList.add('active');empty.hidden=true;closeShell.disabled=false;
      const terminal=new Terminal({cursorBlink:true,scrollback:5000,scrollOnUserInput:true,fontFamily:'Cascadia Mono,Consolas,monospace',fontSize:14,theme:{background:'#0b0f15',foreground:'#d9e1ee',cursor:'#b7c9e5',selectionBackground:'#34517a88'}}),fit=new FitAddon();terminal.loadAddon(fit);terminal.open(host);fit.fit();
      const scheme=location.protocol==='https:'?'wss':'ws',socket=new WebSocket(`${scheme}://${location.host}/api/terminal?shell=${shell.id}&columns=${terminal.cols}&rows=${terminal.rows}`),title=`${shell.name} ${shellNumber}`,send=data=>{if(socket.readyState===WebSocket.OPEN)socket.send(encoder.encode(data))},session={id,shell,title,tab,panel,host,terminal,fit,socket,send,cols:terminal.cols,rows:terminal.rows,ended:false};sessions.set(id,session);
      tab.textContent=title;bindTerminalInteractions(session,text=>requestPaste(session,text),notify);
      socket.binaryType='arraybuffer';socket.onmessage=event=>receiveTerminal(session,event);socket.onopen=()=>{terminal.focus();scheduleFit()};socket.onclose=event=>{if(!session.ended)showEnd(session,'WebSocket',event.code,event.reason||webSocketName(event.code))};
      terminal.onData(send);terminal.onBinary(data=>{if(socket.readyState===WebSocket.OPEN)socket.send(Uint8Array.from(data,c=>c.charCodeAt(0))) });
      tab.onclick=()=>activate(id);tab.oncontextmenu=event=>openTabMenu(session,event);
    }

    function requestPaste(session,text){
      if(!text||session.ended||session.socket.readyState!==WebSocket.OPEN)return;
      const bytes=encoder.encode(text).byteLength,multiline=/[\r\n]/.test(text);
      if(!multiline&&bytes<=5120){pasteTerminal(session.terminal,text);return}
      if(pendingPaste){notify('请先处理当前粘贴内容');return}
      const lines=text.split(/\r\n|\r|\n/).length,limit=32768;pendingPaste={id:session.id,text};
      $('pasteSummary').textContent=`${lines} 行，${bytes.toLocaleString()} 字节${text.length>limit?'，预览已截断':''}`;
      $('pastePreview').textContent=text.length>limit?`${text.slice(0,limit)}\n…`:text;pasteDialog.returnValue='';pasteDialog.showModal();
    }

    function openTabMenu(session,event){
      event.preventDefault();contextSession=session.id;tabMenu.hidden=false;tabMenu.style.left=`${event.clientX}px`;tabMenu.style.top=`${event.clientY}px`;
      const box=tabMenu.getBoundingClientRect();tabMenu.style.left=`${Math.max(6,Math.min(event.clientX,innerWidth-box.width-6))}px`;tabMenu.style.top=`${Math.max(6,Math.min(event.clientY,innerHeight-box.height-6))}px`;tabMenu.querySelector('button').focus();
    }

    function hideTabMenu(){tabMenu.hidden=true;contextSession=null}

    function receiveTerminal(session,event){
      if(typeof event.data!=='string'){session.terminal.write(new Uint8Array(event.data));return}
      try{const message=JSON.parse(event.data);if(message.Type==='closed'){showEnd(session,message.Source,message.Code,message.Name);return}}catch{}
      session.socket.close(1007);
    }

    function showEnd(session,source,code,name){
      if(session.ended)return;session.ended=true;const value=source==='ProcessExit'||source==='WebSocket'?code:`0x${code.toString(16).padStart(8,'0').toUpperCase()}`;
      session.terminal.writeln(`\r\n\x1b[90m[会话已结束 · ${source} ${value}${name?` · ${name}`:''}]\x1b[0m`);
    }

    function webSocketName(code){
      return {1000:'NORMAL_CLOSURE',1001:'GOING_AWAY',1002:'PROTOCOL_ERROR',1006:'ABNORMAL_CLOSURE',1007:'INVALID_PAYLOAD',1008:'POLICY_VIOLATION',1009:'MESSAGE_TOO_BIG',1011:'INTERNAL_ERROR'}[code]||null;
    }

    function closeSession(id){
      const session=sessions.get(id);if(!session)return;const ids=[...sessions.keys()],index=ids.indexOf(id),next=ids[index+1]??ids[index-1]??null;
      if(pendingPaste?.id===id){pendingPaste=null;if(pasteDialog.open)pasteDialog.close('cancel')}
      if(renameSession===id){renameSession=null;if(renameDialog.open)renameDialog.close('cancel')}
      session.ended=true;session.socket.close();session.terminal.dispose();session.tab.remove();session.panel.remove();sessions.delete(id);activate(active===id?next:active);
    }

    function closeActive(){closeSession(active)}

    function showView(name){currentView=name;for(const view of ['terminal','registry','files','processes','services'])$(`${view}View`).hidden=name!==view;for(const button of document.querySelectorAll('.app-nav button'))button.classList.toggle('active',button.dataset.view===name);processes.setActive(name==='processes');if(name==='terminal'){scheduleFit();loadShells()}else if(name==='files')files.activate(clientConnected);else if(name==='services')services.activate(clientConnected)}

    async function call(url,body){const response=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:body?JSON.stringify(body):null}),text=await response.text();if(!response.ok){let error;try{error=JSON.parse(text)}catch{}throw new Error(error?.message||text||`HTTP ${response.status}`)}return text?JSON.parse(text):'操作成功'}
    async function run(action){try{$('result').textContent=JSON.stringify(await action(),null,2)}catch(error){$('result').textContent=error}}
    shellSelect.onchange=()=>selectShell({id:Number(shellSelect.value),name:shellSelect.selectedOptions[0].text});newShell.onclick=emptyNew.onclick=createShell;closeShell.onclick=closeActive;$('toolsButton').onclick=()=>$('toolsDialog').showModal();$('closeTools').onclick=()=>$('toolsDialog').close();
    $('renameTab').onclick=()=>{const session=sessions.get(contextSession);hideTabMenu();if(!session)return;renameSession=session.id;$('renameInput').value=session.title;renameDialog.returnValue='';renameDialog.showModal();$('renameInput').select()};
    $('exportTab').onclick=()=>{const session=sessions.get(contextSession);hideTabMenu();if(session)exportTerminal(session)};
    $('closeTab').onclick=()=>{const id=contextSession;hideTabMenu();closeSession(id)};
    renameDialog.onclose=()=>{const session=sessions.get(renameSession),title=$('renameInput').value.trim();if(renameDialog.returnValue==='rename'&&session&&title){session.title=title;session.tab.textContent=title}renameSession=null;if(session)session.terminal.focus()};
    pasteDialog.onclose=()=>{const paste=pendingPaste;pendingPaste=null;const session=paste&&sessions.get(paste.id);if(pasteDialog.returnValue==='paste'&&session&&!session.ended&&session.socket.readyState===WebSocket.OPEN)pasteTerminal(session.terminal,paste.text);else if(session)session.terminal.focus()};
    document.addEventListener('pointerdown',event=>{if(!tabMenu.hidden&&!tabMenu.contains(event.target))hideTabMenu()});document.addEventListener('keydown',event=>{if(event.key==='Escape')hideTabMenu()});addEventListener('resize',hideTabMenu);tabs.addEventListener('scroll',hideTabMenu);
    for(const button of document.querySelectorAll('.app-nav button'))button.onclick=()=>showView(button.dataset.view);
    $('systemInfo').onclick=()=>run(()=>call('/api/system'));
    $('queryEvents').onclick=()=>queryEvents(false);$('nextEvents').onclick=()=>queryEvents(true);function queryEvents(next){if(!next)eventBookmark='';run(async()=>{const page=await call('/api/eventlog/query',{channelPath:$('channel').value,query:$('query').value||null,bookmark:eventBookmark||null,maxEvents:Number($('maxEvents').value)});eventBookmark=page.nextBookmark;return page})}
    $('enableChannel').onclick=()=>setChannel(true);$('disableChannel').onclick=()=>setChannel(false);function setChannel(enabled){run(()=>call('/api/eventlog/channel',{channelPath:$('channel').value,enabled}))}$('clearChannel').onclick=()=>{if(confirm('确定清除此频道的全部事件？'))run(()=>call('/api/eventlog/clear',{channelPath:$('channel').value}))};
    new ResizeObserver(scheduleFit).observe(terminals);if(await refresh())await loadShells();setInterval(async()=>{const wasConnected=clientConnected,connected=await refresh();if(connected&&!wasConnected){if(currentView==='terminal')loadShells();else if(currentView==='processes')processes.update(true);else if(currentView==='files')files.activate(true);else if(currentView==='services')services.activate(true)}},1000);
  </script>
</body>
</html>
