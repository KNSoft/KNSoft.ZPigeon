<body>
  <header>

    <div class="status"><span id="serverDot" class="dot"></span>Server <span id="server">读取中</span><span id="clientDot" class="dot"></span>Client <span id="client">读取中</span></div>
  </header>
  <main id="terminalView">
    <div class="toolbar">
      <select id="shellSelect" class="shell-select" disabled><option>Client 未连接</option></select>

      <span class="spacer"></span>

      <div id="terminals" class="terminals">
        <div id="empty" class="empty"><b>尚未打开 Shell</b><span>连接 Client 后选择 Shell 并新建会话</span><button id="emptyNew" disabled>新建 Shell</button></div>
      </div>
    </section>
  </main>

  <main id="executionView" class="manager-view" hidden><section id="executionManager" class="manager"></section></main>
  <main id="systemView" class="manager-view" hidden><section id="systemManager" class="manager"></section></main>
  <main id="registryView" hidden><section id="registryEditor" class="registry-editor"></section></main>
  <main id="filesView" class="manager-view" hidden><section id="fileManager" class="manager"></section></main>
  <main id="processesView" class="manager-view" hidden><section id="processManager" class="manager"></section></main>
  <main id="windowsView" class="manager-view" hidden><section id="windowManager" class="manager"></section></main>
  <main id="servicesView" class="manager-view" hidden><section id="serviceManager" class="manager"></section></main>
  <main id="usersView" class="manager-view" hidden><section id="userManager" class="manager"></section></main>
  <main id="softwareView" class="manager-view" hidden><section id="softwareManager" class="manager"></section></main>
  <main id="hardwareView" class="manager-view" hidden><section id="hardwareManager" class="manager"></section></main>
  <main id="certificatesView" class="manager-view" hidden><section id="certificateManager" class="manager"></section></main>
  <main id="browsersView" class="manager-view" hidden><section id="browserManager" class="manager"></section></main>
  <main id="wmiView" class="manager-view" hidden><section id="wmiManager" class="manager"></section></main>
  <main id="updatesView" class="manager-view" hidden><section id="updateManager" class="manager"></section></main>
  <main id="eventsView" class="manager-view" hidden><section id="eventViewer" class="event-viewer"></section></main>
  <main id="tasksView" class="manager-view" hidden><section id="taskManager" class="manager"></section></main>
  <main id="firewallView" class="manager-view" hidden><section id="firewallManager" class="manager"></section></main>
  <main id="wlanView" class="manager-view" hidden><section id="wlanManager" class="manager"></section></main>
  <main id="powerView" class="manager-view" hidden><section id="powerManager" class="manager"></section></main>

  <dialog id="scriptDialog">
    <form method="dialog">
      <h2>在远程终端运行脚本</h2>
      <label>脚本类型<select id="scriptType"></select></label>
      <label>脚本内容<textarea id="scriptText" class="dialog-input" rows="18" spellcheck="false" required></textarea></label>
      <div class="dialog-actions"><button value="cancel">取消</button><button value="run">运行</button></div>
    </form>
  </dialog>

  <div id="tabMenu" class="context-menu" role="menu" hidden>
    <button id="renameTab" role="menuitem">重命名</button>
    <button id="exportTab" role="menuitem">导出文本</button>
    <button id="closeTab" class="danger" role="menuitem">关闭</button>
  </div>

  <dialog id="renameDialog">
    <form method="dialog">
      <h2>重命名标签页</h2>
      <input id="renameInput" class="dialog-input" maxlength="128" required autocomplete="off">
      <div class="dialog-actions"><button value="cancel" formnovalidate>取消</button><button value="rename">重命名</button></div>
    </form>
  </dialog>

  <dialog id="pasteDialog">
    <form method="dialog">
      <h2>确认粘贴</h2>
      <p>粘贴多行或大量文本可能导致命令意外执行。</p>
      <p id="pasteSummary" class="status"></p>
      <pre id="pastePreview" class="clipboard-preview"></pre>
      <div class="dialog-actions"><button value="cancel">取消</button><button value="paste" class="danger">仍然粘贴</button></div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script type="module">

    let active=null,selectedShell=null,clientConnected=false,shellsLoaded=false,shellsLoading=false,sessionsRestored=false,currentView='terminal',fitFrame=0,contextSession=null,renameSession=null,pendingPaste=null,toastTimer=0;
    const filePicker=new RemoteFilePicker({call,notify}),aclEditor=new AclEditor({call,notify});

    const control=(action,identity,argument=null,secret=null)=>({action,identity,argument,secret});
    const revealRegistry=(root,path)=>{showView('registry');registry.reveal(root,path)},revealService=name=>{showView('services');services.revealService(name)};
    const users=new UserManager($('userManager'),{call,notify,path:'users',columns:[{title:'用户名',value:r=>r.identity},{title:'全名',value:r=>r.name},{title:'描述',value:r=>r.description},{title:'主目录',value:r=>r.detail},{title:'状态',value:r=>r.flags&2?'已禁用':'已启用'}],actions:[{title:'启用',request:async r=>control(3,r.identity)},{title:'禁用',request:async r=>control(4,r.identity)},{title:'重命名',request:async r=>users.rename(r)},{title:'设置密码',request:async r=>{users.edit(r);return null}},{title:'删除',danger:true,request:async r=>confirm(`确定删除用户 ${r.identity}？`)?control(2,r.identity):null}]});

    const certificates=new CertificateManager($('certificateManager'),{call,notify});
    const browsers=new BrowserManager($('browserManager'),{call,notify});
    const wmi=new WmiManager($('wmiManager'),{call,notify});
    const updates=new UpdateManager($('updateManager'),{call,notify});
    const tasks=new TaskManager($('taskManager'),{call,notify});
    const events=new EventViewer($('eventViewer'),{call,notify});
    const firewall=new FirewallManager($('firewallManager'),{call,notify,revealEvents:channel=>{showView('events');events.openChannel(channel)}});
    const system=new SystemInformationManager($('systemManager'),{call,notify,filePicker}),wlan=new WlanManager($('wlanManager'),{call,notify});
    const power=new PowerManager($('powerManager'),{call,notify}),administration=[system,users,software,hardware,certificates,browsers,wmi,updates,events,tasks,firewall,wlan,power];
    const execution=new ExecutionManager($('executionManager'),{call,notify,openTerminal:openScriptDialog,filePicker});
    files.disconnect();processes.disconnect();windows.disconnect();services.disconnect();for(const manager of administration)manager.disconnect();

    async function refresh(){
      try{
        const state=await fetch('/api/status').then(r=>r.json()),connected=state.clientConnected,disconnected=clientConnected&&!connected;clientConnected=connected;

        $('serverDot').className=`dot ${state.state===2?'ok':'off'}`;$('clientDot').className=`dot ${connected?'ok':'off'}`;
        if(disconnected){selectedShell=null;shellsLoaded=false;shellSelect.replaceChildren(new Option('Client 未连接'));files.disconnect();processes.disconnect();windows.disconnect();services.disconnect();for(const manager of administration)manager.disconnect()}

    async function loadShells(){

      try{text=await response.text()}
      catch{throw new Error('Web 传输中断：HTTP 响应未完整到达')}
      if(!response.ok){
        let error;
        try{error=JSON.parse(text)}catch{}
        const typed=Number.isInteger(error?.type)&&Number.isInteger(error?.code)?
          `错误类型 ${error.type}：0x${error.code.toString(16).padStart(8,'0').toUpperCase()}`:'';
        throw new Error(error?.message||typed||text||`HTTP ${response.status}`)
      }
      return text?JSON.parse(text):'操作成功'
    }
    shellSelect.onchange=()=>selectShell({id:Number(shellSelect.value),name:shellSelect.selectedOptions[0].text});newShell.onclick=emptyNew.onclick=createShell;scriptButton.onclick=openScriptDialog;closeShell.onclick=closeActive;
    scriptDialog.addEventListener('submit',event=>{event.preventDefault();createScript()});
    $('renameTab').onclick=()=>{const session=sessions.get(contextSession);hideTabMenu();if(!session)return;renameSession=session.id;$('renameInput').value=session.title;renameDialog.returnValue='';renameDialog.showModal();$('renameInput').select()};
    $('exportTab').onclick=()=>{const session=sessions.get(contextSession);hideTabMenu();if(session)exportTerminal(session)};
    $('closeTab').onclick=()=>{const id=contextSession;hideTabMenu();closeSession(id)};
    renameDialog.onclose=async()=>{const session=sessions.get(renameSession),title=$('renameInput').value.trim();if(renameDialog.returnValue==='rename'&&session&&title)try{await call('/api/terminal/session/rename',{id:session.id,title});session.title=title;session.tab.textContent=title}catch(error){notify(error)}renameSession=null;if(session)session.terminal.focus()};
    pasteDialog.onclose=()=>{const paste=pendingPaste;pendingPaste=null;const session=paste&&sessions.get(paste.id);if(pasteDialog.returnValue==='paste'&&session&&!session.ended&&session.socket.readyState===WebSocket.OPEN)pasteTerminal(session.terminal,paste.text);else if(session)session.terminal.focus()};
    document.addEventListener('pointerdown',event=>{if(!tabMenu.hidden&&!tabMenu.contains(event.target))hideTabMenu()});document.addEventListener('keydown',event=>{if(event.key==='Escape')hideTabMenu()});addEventListener('resize',hideTabMenu);tabs.addEventListener('scroll',hideTabMenu);
    for(const button of document.querySelectorAll('.app-nav button'))button.onclick=()=>showView(button.dataset.view);
    new ResizeObserver(scheduleFit).observe(terminals);const connected=await refresh();await restoreSessions();if(connected)await loadShells();setInterval(async()=>{const wasConnected=clientConnected,connected=await refresh();if(connected&&!wasConnected)showView(currentView)},1000);
  </script>
</body>
</html>
